name: Build desktop platform

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      artifact:
        required: true
        type: string
      bundles:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 5))
            done
            return 1
          }
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          retry sudo apt-get update
          retry sudo apt-get install -y --no-install-recommends libfuse2 libnss3 libgtk-3-0 libasound2 xvfb
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: odoo-manager-next/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install frontend and Electron dependencies
        working-directory: odoo-manager-next
        run: npm ci
      - name: Install sidecar builder
        run: python -m pip install pyinstaller==6.21.0
      - name: Download the Linux runtime embedded in the Windows installer
        if: runner.os == 'Windows'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sdk-manager-linux-runtime
          path: odoo-manager-next/electron/binaries
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Build native backend and Electron installer
        env:
          CI: "true"
        run: python scripts/build_desktop.py --bundles ${{ inputs.bundles }}
      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        run: python scripts/smoke_test_electron.py --bundle-directory odoo-manager-next/release
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_test_electron.py --bundle-directory odoo-manager-next/release
      - name: Upload installers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.artifact }}
          path: |
            odoo-manager-next/release/*.dmg
            odoo-manager-next/release/*.deb
            odoo-manager-next/release/*.AppImage
            odoo-manager-next/release/*.exe
          retention-days: 1
          if-no-files-found: error

