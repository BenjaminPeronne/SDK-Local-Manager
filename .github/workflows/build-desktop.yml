name: Build desktop applications
run-name: "${{ github.event.head_commit.message || format('Build desktop applications — {0}', github.ref_name) }}"

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

# Actions épinglées par commit, pas par tag : un tag peut être déplacé vers un autre code, un
# commit non. Pour mettre une action à jour, relever le commit de sa nouvelle version :
#   gh api repos/actions/checkout/commits/v5 --jq .sha

jobs:
  build-unix:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            artifact: odoo-manager-macos
            bundles: app,dmg
          - platform: ubuntu-22.04
            artifact: odoo-manager-linux-x64
            bundles: deb,appimage
    uses: ./.github/workflows/build-desktop-platform.yml
    with:
      platform: ${{ matrix.platform }}
      artifact: ${{ matrix.artifact }}
      bundles: ${{ matrix.bundles }}

  build-windows:
    name: odoo-manager-windows-x64
    needs: wsl-image
    uses: ./.github/workflows/build-desktop-platform.yml
    with:
      platform: windows-latest
      artifact: odoo-manager-windows-x64
      bundles: nsis

  wsl-image:
    name: sdk-manager-linux-runtime
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Check the distribution contents
        run: python -m unittest tests.test_wsl_image -v
      - name: Build the WSL distribution image
        run: python scripts/build_wsl_image.py
      - name: Check the built image
        run: |
          set -euxo pipefail
          version=$(python -c "import json,pathlib;print(json.loads(pathlib.Path('odoo-manager-next/package.json').read_text())['version'])")
          archive="dist/wsl/sdk-manager-${version}.wsl"
          (cd dist/wsl && sha256sum -c "sdk-manager-${version}.wsl.sha256")
          # Le noyau WSL manque au runner : le contenu est vérifié dans l'archive elle-même.
          tar -tf "$archive" etc/wsl.conf etc/docker/daemon.json opt/sdk-manager/provision.sh usr/bin/dockerd usr/bin/git > /dev/null
          tar -xOf "$archive" etc/sdk-manager-release | grep -Fx "$version"
          tar -xOf "$archive" etc/wsl.conf | grep -F "systemd = true"
      - name: Build the Linux backend that runs inside the distribution
        run: |
          set -euxo pipefail
          python -m pip install pyinstaller==6.21.0
          python scripts/build_electron_sidecar.py --clean
      - name: Lay out the runtime as the Windows installer expects it
        run: |
          set -euxo pipefail
          mkdir -p runtime/wsl runtime/backend-linux
          cp dist/wsl/*.wsl dist/wsl/*.sha256 runtime/wsl/
          # Exécutable et dossier de runtime PyInstaller (onedir) : l'un ne démarre pas sans l'autre.
          cp -R odoo-manager-next/electron/binaries/odoo-manager-backend odoo-manager-next/electron/binaries/odoo-manager-backend-runtime runtime/backend-linux/
          test -x runtime/backend-linux/odoo-manager-backend
          test -d runtime/backend-linux/odoo-manager-backend-runtime
      - name: Upload the Linux runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sdk-manager-linux-runtime
          path: runtime/**
          retention-days: 1
          if-no-files-found: error
