# Compilation multiplateforme de SDK Local Manager, équivalent de .github/workflows/build-desktop.yml.
#
# Déclenchement : un tag app-v* (poussé par scripts/build_all_platforms_gitlab.sh) ou un lancement
# manuel depuis Build › Pipelines › Exécuter le pipeline.
#
# Runners attendus :
#   - Linux avec Docker (images ci-dessous) ; le job wsl-image a besoin du mode privilégié (Docker-in-Docker) ;
#   - macOS et Windows en exécuteur « shell », avec Node.js 22, Python 3.12 et Git installés.
# Les tags de ces runners se règlent dans Paramètres › CI/CD › Variables (MACOS_RUNNER_TAG, WINDOWS_RUNNER_TAG).

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^app-v/
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  MACOS_RUNNER_TAG: macos
  WINDOWS_RUNNER_TAG: windows
  NODE_VERSION: "22.20.0"

stages:
  - runtime
  - build

# Image Linux commune : Python 3.12 (celui de la CI GitHub) complété par Node.js 22.
.linux-python-node:
  image: python:3.12-bookworm
  before_script:
    - set -eu
    - curl -fsSL --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" | tar -xJ -C /usr/local --strip-components=1
    - node --version && npm --version && python --version

# --- Environnement Linux embarqué dans l'installateur Windows -------------------------------

wsl-image:
  stage: runtime
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - apk add --no-cache python3 tar coreutils
    - python3 -m unittest tests.test_wsl_image -v
    - python3 scripts/build_wsl_image.py
    - |
      set -eu
      version=$(python3 -c "import json,pathlib;print(json.loads(pathlib.Path('odoo-manager-next/package.json').read_text())['version'])")
      archive="dist/wsl/sdk-manager-${version}.wsl"
      (cd dist/wsl && sha256sum -c "sdk-manager-${version}.wsl.sha256")
      # Le noyau WSL manque au runner : le contenu est vérifié dans l'archive elle-même.
      tar -tf "$archive" etc/wsl.conf etc/docker/daemon.json opt/sdk-manager/provision.sh usr/bin/dockerd usr/bin/git > /dev/null
      tar -xOf "$archive" etc/sdk-manager-release | grep -Fx "$version"
      tar -xOf "$archive" etc/wsl.conf | grep -F "systemd = true"
      mkdir -p runtime/wsl
      cp dist/wsl/*.wsl dist/wsl/*.sha256 runtime/wsl/
  artifacts:
    paths:
      - runtime/
    expire_in: 1 day

# Backend Linux qui tourne dans la distribution : construit à part, sur glibc (pas l'Alpine de Docker).
linux-backend:
  stage: runtime
  image: python:3.12-bookworm
  script:
    - python -m pip install pyinstaller
    - python scripts/build_electron_sidecar.py --clean
    - |
      set -eu
      mkdir -p runtime/backend-linux
      # Exécutable et dossier de runtime PyInstaller (onedir) : l'un ne démarre pas sans l'autre.
      cp -R odoo-manager-next/electron/binaries/odoo-manager-backend odoo-manager-next/electron/binaries/odoo-manager-backend-runtime runtime/backend-linux/
      test -x runtime/backend-linux/odoo-manager-backend
      test -d runtime/backend-linux/odoo-manager-backend-runtime
  artifacts:
    paths:
      - runtime/
    expire_in: 1 day

# --- Installateurs ----------------------------------------------------------------------

build-linux:
  extends: .linux-python-node
  stage: build
  needs: []
  script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libfuse2 libnss3 libgtk-3-0 libasound2 xvfb xauth
    - cd odoo-manager-next && npm ci && cd ..
    - python -m pip install pyinstaller
    - python -m unittest discover -s tests -v
    - CI=true python scripts/build_desktop.py --bundles deb,appimage
    - xvfb-run -a python scripts/smoke_test_electron.py --bundle-directory odoo-manager-next/release
  artifacts:
    name: odoo-manager-linux-x64
    paths:
      - odoo-manager-next/release/*.deb
      - odoo-manager-next/release/*.AppImage
    expire_in: 1 day

build-macos:
  stage: build
  needs: []
  tags:
    - $MACOS_RUNNER_TAG
  script:
    # Python isolé du système : celui de Homebrew refuse les installations globales (PEP 668).
    - python3.12 -m venv .ci-venv && . .ci-venv/bin/activate
    - cd odoo-manager-next && npm ci && cd ..
    - python -m pip install pyinstaller
    - python -m unittest discover -s tests -v
    - CI=true python scripts/build_desktop.py --bundles app,dmg
    - python scripts/smoke_test_electron.py --bundle-directory odoo-manager-next/release
  artifacts:
    name: odoo-manager-macos
    paths:
      - odoo-manager-next/release/*.dmg
    expire_in: 1 day

build-windows:
  stage: build
  needs:
    - wsl-image
    - linux-backend
  tags:
    - $WINDOWS_RUNNER_TAG
  script:
    # Environnement Linux et backend Linux placés là où l'installateur Windows les attend.
    - New-Item -ItemType Directory -Force odoo-manager-next\electron\binaries | Out-Null
    - Copy-Item -Recurse -Force runtime\* odoo-manager-next\electron\binaries\
    - cd odoo-manager-next; npm ci; if ($LASTEXITCODE) { exit $LASTEXITCODE }; cd ..
    - py -3.12 -m venv .ci-venv; .\.ci-venv\Scripts\Activate.ps1
    - python -m pip install pyinstaller
    - python -m unittest discover -s tests -v; if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - $env:CI = "true"; python scripts/build_desktop.py --bundles nsis; if ($LASTEXITCODE) { exit $LASTEXITCODE }
  artifacts:
    name: odoo-manager-windows-x64
    paths:
      - odoo-manager-next/release/*.exe
    expire_in: 1 day
